<div class="relative" (click)="stop($event)">

  <!-- Bell -->
  <button
    type="button"
    class="bell-button"
    (click)="toggle()">

    <i
      class="fa-regular fa-bell"
      [class.animate-bounce]="animateBell">
    </i>

    @if(unreadCount() > 0){
      <span class="badge badge-pulse">
        {{ unreadCount() }}
      </span>
    }

  </button>

  <!-- Dropdown -->
  @if(opened()){

    <div class="notification-panel">

      <app-notification-dropdown
        [notifications]="notifications()"
        [loading]="loading()"
        [unreadCount]="unreadCount()"
        (open)="openNotification($event)"
        (markRead)="markReadById($event)"
        (markAllRead)="markAllRead()"
        (viewAllClicked)="close()">
      </app-notification-dropdown>

    </div>

  }

</div>
