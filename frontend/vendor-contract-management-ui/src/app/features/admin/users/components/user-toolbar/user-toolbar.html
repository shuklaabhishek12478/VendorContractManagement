<div class="toolbar">

    

    <div class="toolbar-right">

        <button
          *ngIf="canRefresh"
            mat-stroked-button
            color="primary"
            (click)="refresh.emit()">

            <mat-icon>

                refresh

            </mat-icon>

            Refresh

        </button>

        <button
        *ngIf="canExport"
    mat-raised-button
    color="primary"
    (click)="export.emit()">

    <mat-icon>download</mat-icon>

    Export

</button>

<ng-container *ngIf="canImport">
<input
    #fileInput
    type="file"
    accept=".xlsx,.xls"
    hidden
    (change)="onFileSelected($event)">

<button
    mat-raised-button
    color="accent"
    (click)="fileInput.click()">

    <mat-icon>upload</mat-icon>

    Import

</button>
</ng-container>
        <button
            *ngIf="canEdit"
            mat-stroked-button
            color="primary"
            [disabled]="selectedUserId===0"
            (click)="edit.emit()">

            <mat-icon>

                edit

            </mat-icon>

            Edit

        </button>

        <button
        *ngIf="canAdd"
            mat-raised-button
            color="primary"
            routerLink="/users/add">

            <mat-icon>

                person_add

            </mat-icon>

            Add User

        </button>

    </div>

</div>
