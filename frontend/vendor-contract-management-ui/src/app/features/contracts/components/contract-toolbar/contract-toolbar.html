<div class="flex items-center gap-3 mb-6">

    <!-- CREATE -->
    <ng-container *appHasPermission="'Contract.Create'">

        <app-add-contract-button
            [disabled]="!canAdd"
            (add)="add.emit()">
        </app-add-contract-button>

    </ng-container>


    <!-- EDIT -->
    <ng-container *appHasPermission="'Contract.Edit'">

        <app-edit-contract-button
            [disabled]="!canEdit"
            (edit)="edit.emit()">
        </app-edit-contract-button>

    </ng-container>


    <!-- ARCHIVE -->
    <ng-container *appHasPermission="'Contract.Archive'">

        <app-archive-contract-button
            [disabled]="!canArchive"
            (archive)="archive.emit()">
        </app-archive-contract-button>

    </ng-container>


    <!-- DELETE -->
    <ng-container *appHasPermission="'Contract.Delete'">

        <app-remove-contract-button
            [disabled]="!canRemove"
            (remove)="remove.emit()">
        </app-remove-contract-button>

    </ng-container>

</div>
