<div class="page-container">

  <div class="page-header">

    <div>

            <div class="text-sm text-slate-500 mb-1">

                Contracts / Add Contract

            </div>

            <h1 class="text-3xl font-bold">

                Add Contract

            </h1>

            <p class="text-slate-500 mt-1">

                Create a new Contract with vendor, contact and financial information.

            </p>

        </div>

  </div>

  <mat-card>

    <mat-card-content>

      <app-contract-form

        [form]="form"

        [vendors]="vendors"

        [loading]="loading"

        (save)="save()"

        (cancel)="cancel()">

      </app-contract-form>

    </mat-card-content>

  </mat-card>

</div>
