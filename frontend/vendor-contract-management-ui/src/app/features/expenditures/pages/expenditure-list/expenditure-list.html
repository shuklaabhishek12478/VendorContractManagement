<div class="space-y-6">

  <!-- Header -->

  <div class="flex items-center justify-between">

    <div>

      <h1 class="text-3xl font-bold text-slate-800">

        Expenditure Management

      </h1>

      <p class="text-slate-500 mt-1">

        Track, monitor and control organizational expenditures.

      </p>

    </div>
    </div>
    <div class="space-y-6">
    <app-expenditure-toolbar

      [selectedExpenditure]="selectedExpenditure"

      [selectedExpenditures]="selectedExpenditures"

      (add)="openAddExpenditure()"

      (edit)="onEditExpenditure()"

      (deleteSelected)="removeSelectedExpenditures()"

      (export)="exportExcel()"

      (refresh)="refresh()"

      (dashboard)="openDashboard()"

      (forecast)="openForecast()">

    </app-expenditure-toolbar>
</div>
  

  <!-- Summary -->
<div class="space-y-6">
  <app-expenditure-summary-cards

      [summary]="summary">

  </app-expenditure-summary-cards>
</div>
  <!-- Filters -->

  <app-expenditure-filter
    [filter]="filter"
    [vendors]="vendors"
    [contracts]="contracts"
    (filterChange)="applyFilter($event)"
    (clear)="clearFilters()">
</app-expenditure-filter>

  <!-- Search -->

  <div class="flex items-center gap-4">

      <input

          type="text"

          placeholder="Search expenditure..."

          class="w-full rounded-xl border px-4 py-3"

          (input)="onSearch($event)">

  </div>

  <!-- Grid -->

  <div
      class="rounded-2xl border bg-white shadow-sm overflow-hidden"
      style="height:650px;">

      <ag-grid-angular

          class="ag-theme-quartz"

          style="width:100%;height:100%;"

          [rowData]="rowData"

          [columnDefs]="columnDefs"

          rowSelection="multiple"

          [pagination]="true"

          [paginationPageSize]="pageSize"

          [paginationPageSizeSelector]="pageSizeOptions"

          (gridReady)="onGridReady($event)"

          (selectionChanged)="onSelectionChanged()"

          (rowDoubleClicked)="onRowDoubleClicked($event)"

          (sortChanged)="onSortChanged()">

      </ag-grid-angular>

  </div>

  <!-- Footer -->

  <div class="flex items-center justify-between">

      <div class="text-sm text-slate-500">

          Showing

          {{rowData.length}}

          of

          {{totalRecords}}

          expenditures

      </div>

      <div class="flex items-center gap-3">

          <button

              mat-stroked-button

              (click)="previousPage()"

              [disabled]="currentPage===1">

              Previous

          </button>

          <span>

              Page

              {{currentPage}}

              of

              {{totalPages}}

          </span>

          <button

              mat-stroked-button

              (click)="nextPage()"

              [disabled]="currentPage===totalPages">

              Next

          </button>

          <select

              class="border rounded-lg px-3 py-2"

              (change)="changePageSize($event)">

              @for(size of pageSizeOptions;track size){

                  <option

                      [value]="size"

                      [selected]="size===pageSize">

                      {{size}}

                  </option>

              }

          </select>

      </div>

  </div>

</div>
