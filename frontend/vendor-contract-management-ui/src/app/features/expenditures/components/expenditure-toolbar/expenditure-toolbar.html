<div class="toolbar">

    <button
        mat-flat-button
        color="primary"
        (click)="add.emit()">

        <mat-icon>add</mat-icon>

        Add Expenditure

    </button>

    <button
        mat-stroked-button
        [disabled]="!selectedExpenditure"
        (click)="edit.emit()">

        <mat-icon>edit</mat-icon>

        Edit

    </button>

    <button
        mat-stroked-button
        color="warn"
        [disabled]="selectedExpenditures.length===0"
        (click)="remove.emit()">

        <mat-icon>delete</mat-icon>

        Delete

    </button>

    <span class="spacer"></span>

    <button
        mat-stroked-button
        (click)="dashboard.emit()">

        <mat-icon>dashboard</mat-icon>

        Dashboard

    </button>

    <button
        mat-stroked-button
        (click)="forecast.emit()">

        <mat-icon>trending_up</mat-icon>

        Forecast

    </button>

    <button
        mat-stroked-button
        (click)="export.emit()">

        <mat-icon>download</mat-icon>

        Export

    </button>

    <button
        mat-icon-button
        (click)="refresh.emit()">

        <mat-icon>refresh</mat-icon>

    </button>

</div>
