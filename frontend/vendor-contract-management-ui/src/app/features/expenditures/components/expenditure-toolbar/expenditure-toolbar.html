<div class="toolbar">
  <ng-container *appHasPermission="'Expenditure.Create'">
    <button
        mat-flat-button
        color="primary"
        (click)="add.emit()">

        <mat-icon>add</mat-icon>

        Add Expenditure

    </button>
</ng-container>

<ng-container *appHasPermission="'Expenditure.Update'">
    <button
        mat-stroked-button
        [disabled]="!selectedExpenditure"
        (click)="edit.emit()">

        <mat-icon>edit</mat-icon>

        Edit

    </button>
 </ng-container>

 <ng-container *appHasPermission="'Expenditure.Delete'">
    <button
        mat-stroked-button
        color="warn"
        [disabled]="selectedExpenditures.length===0"
        (click)="remove.emit()">

        <mat-icon>delete</mat-icon>

        Delete

    </button>
</ng-container>

    <span class="spacer"></span>

    <ng-container *appHasPermission="'Expenditure.Dashboard'">
    <button
        mat-stroked-button
        (click)="dashboard.emit()">

        <mat-icon>dashboard</mat-icon>

        Dashboard

    </button>
   </ng-container>

   <ng-container *appHasPermission="'Expenditure.Forecast'">
    <button
        mat-stroked-button
        (click)="forecast.emit()">

        <mat-icon>trending_up</mat-icon>

        Forecast

    </button>
   </ng-container>

   <ng-container *appHasPermission="'Expenditure.Export'">
    <button
        mat-stroked-button
        (click)="export.emit()">

        <mat-icon>download</mat-icon>

        Export

    </button>
   </ng-container>

   
    <button
        mat-icon-button
        (click)="refresh.emit()">

        <mat-icon>refresh</mat-icon>

    </button>

</div>
