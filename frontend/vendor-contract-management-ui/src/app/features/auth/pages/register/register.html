<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">

  <div class="w-full max-w-lg rounded-3xl bg-white p-8 shadow-xl">

    <!-- ============================================= -->
    <!-- Header -->
    <!-- ============================================= -->

    <div class="mb-8 text-center">

      <h1 class="text-3xl font-bold">

        Create Account

      </h1>

      <p class="mt-2 text-slate-500">

        Register to Vendor Contract Management

      </p>

    </div>

    <!-- ============================================= -->
    <!-- Form -->
    <!-- ============================================= -->

    <form

      [formGroup]="registerForm"

      (ngSubmit)="register()"

      class="space-y-5">

      <!-- Full Name -->

      <div>

        <label class="mb-2 block text-sm font-medium">

          Full Name

        </label>

        <input

          type="text"

          formControlName="fullName"

          placeholder="Enter your full name"

          class="w-full rounded-xl border border-slate-300 p-3 outline-none focus:border-indigo-600" />

        <small

          class="text-red-600"

          *ngIf="registerForm.controls.fullName.touched &&
                 registerForm.controls.fullName.invalid">

          Full Name is required.

        </small>

      </div>

      <!-- Email -->

      <div>

        <label class="mb-2 block text-sm font-medium">

          Email

        </label>

        <input

          type="email"

          formControlName="email"

          placeholder="Enter email"

          class="w-full rounded-xl border border-slate-300 p-3 outline-none focus:border-indigo-600" />

        <small

          class="text-red-600"

          *ngIf="registerForm.controls.email.touched &&
                 registerForm.controls.email.invalid">

          Valid email is required.

        </small>

      </div>

      <!-- Password -->

      <div>

        <label class="mb-2 block text-sm font-medium">

          Password

        </label>

        <input

          type="password"

          formControlName="password"

          placeholder="Enter password"

          class="w-full rounded-xl border border-slate-300 p-3 outline-none focus:border-indigo-600" />

      </div>

      <!-- Confirm Password -->

      <div>

        <label class="mb-2 block text-sm font-medium">

          Confirm Password

        </label>

        <input

          type="password"

          formControlName="confirmPassword"

          placeholder="Confirm password"

          class="w-full rounded-xl border border-slate-300 p-3 outline-none focus:border-indigo-600" />

      </div>

      <!-- Password Match -->

      <small

        class="text-red-600"

        *ngIf="registerForm.hasError('passwordMismatch')
               && registerForm.controls.confirmPassword.touched">

        Password and Confirm Password must match.

      </small>

      <!-- Vendor -->

      <div>

        <label class="mb-2 block text-sm font-medium">

          Vendor Id (Optional)

        </label>

        <input

          type="number"

          formControlName="vendorId"

          placeholder="Vendor Id"

          class="w-full rounded-xl border border-slate-300 p-3 outline-none focus:border-indigo-600" />

      </div>

      <!-- Button -->

      <button

        type="submit"

        [disabled]="loading"

        class="w-full rounded-xl bg-indigo-600 py-3 font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-400">

        <span *ngIf="!loading">

          Register

        </span>

        <span *ngIf="loading">

          Creating Account...

        </span>

      </button>

    </form>

    <!-- ============================================= -->
    <!-- Footer -->
    <!-- ============================================= -->

    <div class="mt-8 text-center text-sm">

      Already have an account?

      <a

        routerLink="/login"

        class="font-semibold text-indigo-600 hover:underline">

        Login

      </a>

    </div>

  </div>

</div>
