<div class="role-toolbar">

    <button
        mat-raised-button
        color="primary"
        class="primary-btn"
        (click)="add.emit()">

        <mat-icon>add</mat-icon>
        <span>Add Role</span>

    </button>

    <button
        mat-stroked-button
        class="action-btn"
        [disabled]="!hasSelection || !canEdit"
        (click)="edit.emit()">

        <mat-icon>edit</mat-icon>
        <span>Edit</span>

    </button>

    <button
        mat-stroked-button
        color="warn"
        class="action-btn"
        [disabled]="!hasSelection || !canDelete"
        (click)="delete.emit()">

        <mat-icon>delete</mat-icon>
        <span>Delete</span>

    </button>

    <button
        mat-stroked-button
        color="primary"
        class="action-btn"
        [disabled]="!hasSelection || isActive"
        (click)="activate.emit()">

        <mat-icon>check_circle</mat-icon>
        <span>Activate</span>

    </button>

    <button
        mat-stroked-button
        color="warn"
        class="action-btn"
        [disabled]="!hasSelection || !isActive"
        (click)="deactivate.emit()">

        <mat-icon>block</mat-icon>
        <span>Deactivate</span>

    </button>

    <button
        mat-stroked-button
        class="action-btn"
        [disabled]="!hasSelection"
        (click)="assignPermissions.emit()">

        <mat-icon>security</mat-icon>
        <span>Permissions</span>

    </button>

    <button
        mat-stroked-button
        class="action-btn"
        [disabled]="!hasSelection"
        (click)="assignUsers.emit()">

        <mat-icon>groups</mat-icon>
        <span>Users</span>

    </button>

    <button
        mat-stroked-button
        class="action-btn"
        [disabled]="!hasSelection"
        (click)="clone.emit()">

        <mat-icon>content_copy</mat-icon>
        <span>Clone</span>

    </button>

    <button
        mat-raised-button
        color="accent"
        class="accent-btn"
        [disabled]="!hasSelection"
        (click)="permissionMatrix.emit()">

        <mat-icon>verified_user</mat-icon>
        <span>Permission Matrix</span>

    </button>

</div>
