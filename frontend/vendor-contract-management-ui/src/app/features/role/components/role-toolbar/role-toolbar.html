<div class="flex flex-wrap gap-3 mb-6">

  <!-- Add -->
  <button
    *ngIf="canAdd"
    mat-raised-button
    color="primary"
    (click)="add.emit()">

    <mat-icon>add</mat-icon>
    Add Role

  </button>


  <!-- Edit -->
  <button
    *ngIf="canEdit"
    mat-stroked-button
    [disabled]="!hasSelection"
    (click)="edit.emit()">

    <mat-icon>edit</mat-icon>
    Edit

  </button>


  <!-- Delete -->
  <button
    *ngIf="canDelete"
    mat-stroked-button
    color="warn"
    [disabled]="!hasSelection"
    (click)="delete.emit()">

    <mat-icon>delete</mat-icon>
    Delete

  </button>


  <!-- Activate -->
  <button
    *ngIf="canActivate"
    mat-stroked-button
    color="primary"
    [disabled]="!hasSelection || isActive"
    (click)="activate.emit()">

    <mat-icon>check_circle</mat-icon>
    Activate

  </button>


  <!-- Deactivate -->
  <button
    *ngIf="canDeactivate"
    mat-stroked-button
    color="warn"
    [disabled]="!hasSelection || !isActive"
    (click)="deactivate.emit()">

    <mat-icon>block</mat-icon>
    Deactivate

  </button>


  <!-- Permissions -->
  <button
    *ngIf="canAssignPermissions"
    mat-stroked-button
    [disabled]="!hasSelection"
    (click)="assignPermissions.emit()">

    <mat-icon>security</mat-icon>
    Permissions

  </button>


  <!-- Users -->
  <button
    *ngIf="canAssignUsers"
    mat-stroked-button
    [disabled]="!hasSelection"
    (click)="assignUsers.emit()">

    <mat-icon>groups</mat-icon>
    Users

  </button>


  <!-- Clone -->
  <button
    *ngIf="canClone"
    mat-stroked-button
    [disabled]="!hasSelection"
    (click)="clone.emit()">

    <mat-icon>content_copy</mat-icon>
    Clone

  </button>


  <!-- Permission Matrix -->
  <button
    *ngIf="canPermissionMatrix"
    mat-raised-button
    color="accent"
    [disabled]="!hasSelection"
    (click)="permissionMatrix.emit()">

    <mat-icon>security</mat-icon>
    Permission Matrix

  </button>

</div>
