<h2 mat-dialog-title>

    Approve User Registration

</h2>

<mat-dialog-content>

    <!-- User Summary -->

    <div class="user-summary">

        <div class="summary-row">

            <label>Name</label>

            <span>{{user.fullName}}</span>

        </div>

        <div class="summary-row">

            <label>Email</label>

            <span>{{user.email}}</span>

        </div>

       

    </div>

    <!-- Loading -->

    <div
        class="loading-container"
        *ngIf="loadingRoles">

        <mat-spinner
            diameter="36">
        </mat-spinner>

    </div>

    <!-- Form -->

    <form
        *ngIf="!loadingRoles"
        [formGroup]="form">

        <mat-form-field
            appearance="outline"
            class="full-width">

            <mat-label>

                Assign Role

            </mat-label>

            <mat-select
                formControlName="roleId">

                <mat-option
                    *ngFor="let role of roles"
                    [value]="role.id">

                    {{role.name}}

                </mat-option>

            </mat-select>

            <mat-error
                *ngIf="
                form.controls['roleId'].hasError('required')
                ">

                Role is required.

            </mat-error>

        </mat-form-field>

    </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
        mat-stroked-button
        color="primary"
        (click)="cancel()"
        [disabled]="saving">

        Cancel

    </button>

    <button
        mat-flat-button
        color="primary"
        (click)="approve()"
        [disabled]="form.invalid || saving">

        <mat-spinner
            *ngIf="saving"
            diameter="20">
        </mat-spinner>

        <span *ngIf="!saving">

            Approve User

        </span>

    </button>

</mat-dialog-actions>
