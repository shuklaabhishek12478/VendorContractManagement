<div class="approval-toolbar">

    <div class="toolbar-left">

        <button
            *ngIf="canView"
            mat-raised-button
            color="primary"
            (click)="view.emit()"
            [disabled]="!selectedUser">
       
            <mat-icon>

                visibility

            </mat-icon>

            View Details

        </button>

        <button
            *ngIf="canApprove"
            mat-raised-button
            color="primary"
            (click)="approve.emit()"
            [disabled]="!selectedUser">

            <mat-icon>

                check_circle

            </mat-icon>

            Approve

        </button>

        <button
            *ngIf="canReject"
            mat-raised-button
            color="warn"
            (click)="reject.emit()"
            [disabled]="!selectedUser">

            <mat-icon>

                cancel

            </mat-icon>

            Reject

        </button>

    </div>

    <span class="toolbar-spacer"></span>

    <button
    class="refresh-btn"
    mat-stroked-button
    (click)="refresh.emit()">

    <mat-icon>refresh</mat-icon>

    Refresh

</button>

</div>
