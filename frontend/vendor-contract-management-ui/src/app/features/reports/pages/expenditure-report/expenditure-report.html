<div class="expenditure-report">

    <!-- ==========================================================
         PAGE HEADER
    =========================================================== -->

    <div class="page-header">

        <div>

            <h1>

                Expenditure Report

            </h1>

            <p>

                Financial expenditure, payment tracking and budget analytics

            </p>

        </div>

        <div class="page-info">

            <span>

                Last Updated

            </span>

            <strong>

                {{ lastUpdated }}

            </strong>

        </div>

    </div>

    <!-- ==========================================================
         TOOLBAR
    =========================================================== -->

    <app-report-toolbar

        [loading]="loading"

        (refresh)="refresh()"

        (excel)="exportExcel()"

        (pdf)="exportPdf()">

    </app-report-toolbar>

    <!-- ==========================================================
         FILTER
    =========================================================== -->

    <app-report-filter

        [loading]="loading"

        [filter]="filter"

        (filterChanged)="onFilterChanged($event)"

        (reset)="resetFilters()">

    </app-report-filter>

    <!-- ==========================================================
         SUMMARY
    =========================================================== -->

    <app-report-summary-cards

        [summary]="summary"

        (cardClick)="onSummaryClick($event)">

    </app-report-summary-cards>

    <!-- ==========================================================
         CHART ROW 1
    =========================================================== -->

  <div class="chart-grid">

    <app-report-chart
        title="Department Spend"
        type="bar"
        [loading]="loading"
        [data]="departmentChart">
    </app-report-chart>

    <app-report-chart
        title="Department Distribution"
        type="donut"
        [loading]="loading"
        [data]="departmentChart">
    </app-report-chart>

</div>

    <!-- ==========================================================
         CHART ROW 2
    =========================================================== -->

    <div class="chart-grid">

    <app-report-chart
        title="Category Spend"
        type="pie"
        [loading]="loading"
        [data]="categoryChart">
    </app-report-chart>

    <app-report-chart
        title="Category Spend Comparison"
        type="bar"
        [loading]="loading"
        [data]="categoryChart">
    </app-report-chart>

</div>

    <!-- ==========================================================
         REPORT TABLE
    =========================================================== -->

    <app-report-table

        [loading]="loading"

        [columnDefs]="columnDefs"

        [rowData]="rowData"

        [height]="'650px'"

        (rowDoubleClick)="onRowDoubleClick($event)">

    </app-report-table>

</div>
