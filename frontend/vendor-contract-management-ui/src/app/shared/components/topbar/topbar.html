<header
  class="sticky top-0 z-50 flex h-16 items-center justify-between border-b border-slate-200 bg-white/80 px-4 backdrop-blur-xl transition-all lg:px-6">

  <!-- ================= Left ================= -->

  <div class="flex items-center gap-3">

    <!-- Mobile Menu -->

    <button
      type="button"
      aria-label="Open Sidebar"
      (click)="toggleSidebar()"
      class="flex h-11 w-11 items-center justify-center rounded-xl transition hover:bg-slate-100 lg:hidden">

      <i class="fa-solid fa-bars text-lg text-slate-700"></i>

    </button>

    <!-- Desktop Sidebar Toggle -->

<!-- Desktop Sidebar Toggle -->

<button
  type="button"
  (click)="toggleSidebar()"
  class="hidden lg:flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white transition-all duration-200 hover:border-indigo-300 hover:bg-indigo-50 hover:text-indigo-600"
  [title]="layout.collapsed() ? 'Expand Sidebar' : 'Collapse Sidebar'">

  <i
    class="fa-solid transition-transform duration-300"
    [class.fa-angles-left]="!layout.collapsed()"
    [class.fa-angles-right]="layout.collapsed()">
  </i>

</button>

    <!-- Logo -->

    <div class="hidden lg:flex lg:flex-col">

      <h1
        class="text-xl font-bold tracking-wide text-indigo-600">

        Vendor Contract Management

      </h1>

      <span
        class="text-xs text-slate-500">

        Enterprise Edition

      </span>

    </div>

  </div>

  <!-- ================= Search ================= -->

  <div
    class="mx-8 hidden max-w-2xl flex-1 lg:block">

    <div class="relative">

      <i
        class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
      </i>

      <input

        type="text"

        [(ngModel)]="search"

        placeholder="Search vendors, contracts, users, reports..."

        class="w-full rounded-2xl border border-slate-200 bg-slate-50 py-3 pl-11 pr-20 text-sm outline-none transition-all duration-200 focus:border-indigo-400 focus:bg-white focus:ring-4 focus:ring-indigo-100">

      <kbd
        class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg border border-slate-300 bg-white px-2 py-1 text-[10px] font-medium text-slate-500">

        Ctrl + K

      </kbd>

    </div>

  </div>

  <!-- ================= Right ================= -->

  <div class="flex items-center gap-2 lg:gap-4">

    <!-- Search Mobile -->

    <button
      type="button"
      aria-label="Search"
      class="flex h-10 w-10 items-center justify-center rounded-xl transition hover:bg-slate-100 lg:hidden">

      <i class="fa-solid fa-magnifying-glass"></i>

    </button>

    <!-- Notification -->

    <app-notification-bell />

    <!-- Profile -->

    <div
      class="relative"
      (click)="stop($event)">

      <button

        type="button"

        aria-label="User Menu"

        [attr.aria-expanded]="profileOpened()"

        (click)="toggleProfile()"

        class="flex items-center gap-3 rounded-xl px-2 py-2 transition hover:bg-slate-100">

        <!-- Avatar -->

        <div class="relative">

          <div
            class="flex h-11 w-11 items-center justify-center rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 text-sm font-bold text-white shadow-lg">

            {{ initials }}

          </div>

          <span
            class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-white bg-green-500">
          </span>

        </div>

        <!-- User -->

        <div class="hidden text-left xl:block">

          <div
            class="font-semibold text-slate-800">

            {{ fullName }}

          </div>

          <div
            class="text-xs text-slate-500">

            {{ role }}

          </div>

        </div>

        <i
          class="fa-solid fa-chevron-down hidden text-xs text-slate-500 transition xl:block"
          [class.rotate-180]="profileOpened()">
        </i>

      </button>

      <!-- ================= Dropdown ================= -->

      @if(profileOpened()){

      <div
        class="absolute right-0 mt-3 w-72 origin-top-right overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl max-sm:left-3 max-sm:right-3 max-sm:w-auto">

        <!-- Header -->

        <div
          class="border-b border-slate-100 p-5">

          <div class="flex items-center gap-4">

            <div
              class="flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 text-lg font-bold text-white">

              {{ initials }}

            </div>

            <div>

              <div
                class="font-semibold text-slate-800">

                {{ fullName }}

              </div>

              <div
                class="text-sm text-slate-500">

                {{ email }}

              </div>

              <div
                class="mt-1 text-xs font-medium text-indigo-600">

                {{ role }}

              </div>

            </div>

          </div>

        </div>

        <!-- Menu -->

        <div class="py-2">

          <a

            routerLink="/profile"

            class="flex items-center gap-3 px-5 py-3 transition hover:bg-slate-50">

            <i class="fa-regular fa-user w-5"></i>

            My Profile

          </a>

          <a

            routerLink="/settings"

            class="flex items-center gap-3 px-5 py-3 transition hover:bg-slate-50">

            <i class="fa-solid fa-gear w-5"></i>

            Settings

          </a>

          <a

            routerLink="/change-password"

            class="flex items-center gap-3 px-5 py-3 transition hover:bg-slate-50">

            <i class="fa-solid fa-key w-5"></i>

            Change Password

          </a>

          <hr class="my-2">

          <button

            type="button"

            (click)="logout()"

            class="flex w-full items-center gap-3 px-5 py-3 text-left transition hover:bg-red-50 hover:text-red-600">

            <i
              class="fa-solid fa-right-from-bracket w-5">
            </i>

            Logout

          </button>

        </div>

      </div>

      }

    </div>

  </div>

</header>
