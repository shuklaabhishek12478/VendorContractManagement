<div class="action-buttons">

    <button
        mat-icon-button
        color="primary"
        matTooltip="View"
        (click)="view()">

        <mat-icon>visibility</mat-icon>

    </button>

    <button
        mat-icon-button
        color="accent"
        matTooltip="Edit"
        (click)="edit()">

        <mat-icon>edit</mat-icon>

    </button>

    <button
        mat-icon-button
        color="primary"
        matTooltip="Mark Paid"
        (click)="markAsPaid()">

        <mat-icon>payments</mat-icon>

    </button>

    <button
        mat-icon-button
        color="warn"
        matTooltip="Delete"
        (click)="delete()">

        <mat-icon>delete</mat-icon>

    </button>

</div>
