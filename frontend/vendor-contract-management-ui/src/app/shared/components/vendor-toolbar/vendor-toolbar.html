<div class="flex items-center gap-3 mb-6">

  <!-- CREATE -->
  <ng-container *appHasPermission="'Vendor.Create'">

    <app-add-vendor-button
      [disabled]="!canAdd"
      (add)="add.emit()">
    </app-add-vendor-button>

  </ng-container>


  <!-- EDIT -->
  <ng-container *appHasPermission="'Vendor.Edit'">

    <app-edit-vendor-button
      [disabled]="!canEdit"
      (edit)="edit.emit()">
    </app-edit-vendor-button>

  </ng-container>


  <!-- DEACTIVATE -->
  <ng-container *appHasPermission="'Vendor.Deactivate'">

    <app-archive-vendor-button
      [disabled]="!canArchive"
      (archive)="archive.emit()">
    </app-archive-vendor-button>

  </ng-container>


  <!-- DELETE -->
  <ng-container *appHasPermission="'Vendor.Delete'">

    <app-remove-vendor-button
      [disabled]="!canRemove"
      (remove)="remove.emit()">
    </app-remove-vendor-button>

  </ng-container>

</div>
